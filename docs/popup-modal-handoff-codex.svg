<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-label="Planned handoff and existing valuation form"><title>Planned handoff and existing valuation form</title><style>
:root{--paper:#faf8f6;--card:#fff;--ink:#1c120f;--muted:#73665e;--accent:#a1846d;--tint:#f3e9df;--line:#b8aaa0}
@media(prefers-color-scheme:dark){:root{--paper:#150e0c;--card:#211815;--ink:#f5efe9;--muted:#beaea3;--accent:#c9a882;--tint:#392b22;--line:#806e60}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Arial,sans-serif}main{max-width:1160px;margin:50px auto;padding:0 24px}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.2}h1{font-size:46px;margin:12px 0}h2{font-size:28px}a{color:var(--accent)}.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--accent)}.intro{max-width:800px;color:var(--muted)}figure{margin:32px 0 48px}.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}svg{display:block;width:1080px;max-width:none}svg text{fill:var(--ink);font:15px Arial,sans-serif;text-anchor:middle}svg .sub{fill:var(--muted);font-size:12px}.node{fill:var(--card);stroke:var(--line);stroke-width:1.5}.offer{fill:var(--tint);stroke:var(--accent);stroke-width:2}.system{fill:var(--card);stroke:var(--line);stroke-dasharray:6 4}.end{fill:var(--paper);stroke:var(--line);stroke-dasharray:3 4}.decision{fill:var(--card);stroke:var(--accent);stroke-width:1.5}.edge{fill:none;stroke:var(--accent);stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:var(--muted)}figcaption{color:var(--muted);font-size:14px;margin-top:14px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:14px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--accent)}code{font-size:12px}li{margin:8px 0}.badge{display:inline-block;border:1px dashed var(--accent);padding:3px 10px;font-size:12px;color:var(--accent)}@media print{body{background:white}main{margin:0;max-width:none}.scroll{overflow:visible}svg{width:100%;height:auto}figure{break-inside:avoid}h1{font-size:32px}a{color:inherit}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker></defs><path class="edge" d="M325 67 H400"/><text class="label" x="363" y="53">Proposed</text><path class="edge" d="M680 67 H755"/><text class="label" x="716" y="53">Email link</text><path class="edge" d="M895 100 V155"/><path class="edge" d="M895 220 V275"/><path class="edge" d="M895 340 V395"/><path class="edge" d="M755 427 H680"/><text class="label" x="717" y="415">Submit</text><path class="edge" d="M400 427 H325"/><text class="label" x="360" y="415">Success</text><rect class="node system" x="45" y="35" width="280" height="65" rx="8"/><text class="" x="185.0" y="62.5">Stage 1 lead received</text><text class="sub" x="185.0" y="82.5">Popup or reminder</text><rect class="node end" x="400" y="35" width="280" height="65" rx="8"/><text class="" x="540.0" y="62.5">Planned email automation</text><text class="sub" x="540.0" y="82.5">Test delays: 5 / 20 / 55 minutes</text><rect class="node " x="755" y="35" width="280" height="65" rx="8"/><text class="" x="895.0" y="62.5">Visitor opens valuation link</text><text class="sub" x="895.0" y="82.5">/valuation-link exists today</text><rect class="node offer" x="755" y="155" width="280" height="65" rx="8"/><text class="" x="895.0" y="182.5">1. About your watch</text><text class="sub" x="895.0" y="202.5">Brand, model, reference, year</text><rect class="node offer" x="755" y="275" width="280" height="65" rx="8"/><text class="" x="895.0" y="302.5">2. Watch condition</text><text class="sub" x="895.0" y="322.5">Condition, box, papers, photos</text><rect class="node offer" x="755" y="395" width="280" height="65" rx="8"/><text class="" x="895.0" y="422.5">3. About you</text><text class="sub" x="895.0" y="442.5">Contact details + preferences</text><rect class="node system" x="400" y="395" width="280" height="65" rx="8"/><text class="" x="540.0" y="422.5">POST /api/sell</text><text class="sub" x="540.0" y="442.5">Valuation Link Page source</text><rect class="node offer" x="45" y="395" width="280" height="65" rx="8"/><text class="" x="185.0" y="422.5">Submission confirmation</text><text class="sub" x="185.0" y="442.5">Team notification + follow-up attempts</text></svg>
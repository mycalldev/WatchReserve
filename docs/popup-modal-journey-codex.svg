<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1050" role="img" aria-label="Visitor choices and the one-time reminder"><title>Visitor choices and the one-time reminder</title><style>
:root{--paper:#faf8f6;--card:#fff;--ink:#1c120f;--muted:#73665e;--accent:#a1846d;--tint:#f3e9df;--line:#b8aaa0}
@media(prefers-color-scheme:dark){:root{--paper:#150e0c;--card:#211815;--ink:#f5efe9;--muted:#beaea3;--accent:#c9a882;--tint:#392b22;--line:#806e60}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Arial,sans-serif}main{max-width:1160px;margin:50px auto;padding:0 24px}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.2}h1{font-size:46px;margin:12px 0}h2{font-size:28px}a{color:var(--accent)}.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--accent)}.intro{max-width:800px;color:var(--muted)}figure{margin:32px 0 48px}.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}svg{display:block;width:1080px;max-width:none}svg text{fill:var(--ink);font:15px Arial,sans-serif;text-anchor:middle}svg .sub{fill:var(--muted);font-size:12px}.node{fill:var(--card);stroke:var(--line);stroke-width:1.5}.offer{fill:var(--tint);stroke:var(--accent);stroke-width:2}.system{fill:var(--card);stroke:var(--line);stroke-dasharray:6 4}.end{fill:var(--paper);stroke:var(--line);stroke-dasharray:3 4}.decision{fill:var(--card);stroke:var(--accent);stroke-width:1.5}.edge{fill:none;stroke:var(--accent);stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:var(--muted)}figcaption{color:var(--muted);font-size:14px;margin-top:14px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:14px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--accent)}code{font-size:12px}li{margin:8px 0}.badge{display:inline-block;border:1px dashed var(--accent);padding:3px 10px;font-size:12px;color:var(--accent)}@media print{body{background:white}main{margin:0;max-width:none}.scroll{overflow:visible}svg{width:100%;height:auto}figure{break-inside:avoid}h1{font-size:32px}a{color:inherit}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker></defs><path class="edge" d="M540 85 V115"/><path class="edge" d="M680 160 H760"/><text class="label" x="718" y="149">Yes</text><path class="edge" d="M540 205 V250"/><text class="label" x="555" y="234">No</text><path class="edge" d="M540 315 V360"/><path class="edge" d="M540 430 V455 H185 V485"/><path class="edge" d="M540 430 V485"/><path class="edge" d="M540 455 H895 V485"/><path class="edge" d="M185 545 V595"/><path class="edge" d="M540 545 V595"/><path class="edge" d="M895 545 V595"/><path class="edge" d="M895 665 V710"/><text class="label" x="949" y="693">No redirect</text><path class="edge" d="M895 780 V830"/><path class="edge" d="M760 865 H680"/><text class="label" x="717" y="852">Submit</text><path class="edge" d="M540 830 V665"/><path class="edge" d="M895 900 V950"/><text class="label" x="928" y="932">Dismiss</text><rect class="node " x="400" y="25" width="280" height="60" rx="8"/><text class="" x="540.0" y="50.0">Homepage visit</text><text class="sub" x="540.0" y="70.0">Component mounts</text><polygon class="decision" points="540.0,115 680,160.0 540.0,205 400,160.0"/><text class="" x="540.0" y="165.0">Suppressed for 24h?</text><rect class="node end" x="760" y="130" width="270" height="60" rx="8"/><text class="" x="895.0" y="165.0">No popup this visit</text><rect class="node system" x="400" y="250" width="280" height="65" rx="8"/><text class="" x="540.0" y="277.5">First scroll OR 6 seconds</text><text class="sub" x="540.0" y="297.5">Whichever happens first</text><rect class="node offer" x="400" y="360" width="280" height="70" rx="8"/><text class="" x="540.0" y="390.0">Free valuation popup</text><text class="sub" x="540.0" y="410.0">Name + email; optional marketing</text><rect class="node " x="50" y="485" width="270" height="60" rx="8"/><text class="" x="185.0" y="520.0">Close / Escape / backdrop</text><rect class="node " x="400" y="485" width="280" height="60" rx="8"/><text class="" x="540.0" y="520.0">Submit short form</text><rect class="node " x="760" y="485" width="270" height="60" rx="8"/><text class="" x="895.0" y="520.0">Ask Me Later</text><rect class="node end" x="50" y="595" width="270" height="70" rx="8"/><text class="" x="185.0" y="625.0">Dismiss; suppress for 24h</text><text class="sub" x="185.0" y="645.0">No lead from this action</text><rect class="node system" x="400" y="595" width="280" height="70" rx="8"/><text class="" x="540.0" y="625.0">Shared submission pipeline</text><text class="sub" x="540.0" y="645.0">See diagram 2</text><rect class="node system" x="760" y="595" width="270" height="70" rx="8"/><text class="" x="895.0" y="625.0">Save reminder flag</text><text class="sub" x="895.0" y="645.0">Dismiss; suppress popup for 24h</text><rect class="node system" x="760" y="710" width="270" height="70" rx="8"/><text class="" x="895.0" y="740.0">Visitor later opens /sell</text><text class="sub" x="895.0" y="760.0">Read and clear flag on mount</text><rect class="node offer" x="760" y="830" width="270" height="70" rx="8"/><text class="" x="895.0" y="860.0">Reminder slides in after 700ms</text><text class="sub" x="895.0" y="880.0">Same short form</text><rect class="node " x="400" y="830" width="280" height="70" rx="8"/><text class="" x="540.0" y="870.0">Submit reminder</text><rect class="node end" x="760" y="950" width="270" height="65" rx="8"/><text class="" x="895.0" y="977.5">Close reminder</text><text class="sub" x="895.0" y="997.5">No lead; flag already consumed</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1030" role="img" aria-label="Shared submission pipeline and failure handling"><title>Shared submission pipeline and failure handling</title><style>
:root{--paper:#faf8f6;--card:#fff;--ink:#1c120f;--muted:#73665e;--accent:#a1846d;--tint:#f3e9df;--line:#b8aaa0}
@media(prefers-color-scheme:dark){:root{--paper:#150e0c;--card:#211815;--ink:#f5efe9;--muted:#beaea3;--accent:#c9a882;--tint:#392b22;--line:#806e60}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 Arial,sans-serif}main{max-width:1160px;margin:50px auto;padding:0 24px}h1,h2{font-family:Georgia,serif;font-weight:400;line-height:1.2}h1{font-size:46px;margin:12px 0}h2{font-size:28px}a{color:var(--accent)}.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--accent)}.intro{max-width:800px;color:var(--muted)}figure{margin:32px 0 48px}.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}svg{display:block;width:1080px;max-width:none}svg text{fill:var(--ink);font:15px Arial,sans-serif;text-anchor:middle}svg .sub{fill:var(--muted);font-size:12px}.node{fill:var(--card);stroke:var(--line);stroke-width:1.5}.offer{fill:var(--tint);stroke:var(--accent);stroke-width:2}.system{fill:var(--card);stroke:var(--line);stroke-dasharray:6 4}.end{fill:var(--paper);stroke:var(--line);stroke-dasharray:3 4}.decision{fill:var(--card);stroke:var(--accent);stroke-width:1.5}.edge{fill:none;stroke:var(--accent);stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:var(--muted)}figcaption{color:var(--muted);font-size:14px;margin-top:14px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:14px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--accent)}code{font-size:12px}li{margin:8px 0}.badge{display:inline-block;border:1px dashed var(--accent);padding:3px 10px;font-size:12px;color:var(--accent)}@media print{body{background:white}main{margin:0;max-width:none}.scroll{overflow:visible}svg{width:100%;height:auto}figure{break-inside:avoid}h1{font-size:32px}a{color:inherit}}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker></defs><path class="edge" d="M540 90 V125"/><path class="edge" d="M390 165 H305"/><text class="label" x="346" y="153">No</text><path class="edge" d="M540 205 V245"/><text class="label" x="559" y="232">Yes</text><path class="edge" d="M690 285 H775"/><text class="label" x="734" y="272">Yes</text><path class="edge" d="M540 325 V365"/><text class="label" x="555" y="352">No</text><path class="edge" d="M390 397 H305"/><text class="label" x="348" y="385">Failure</text><path class="edge" d="M540 430 V475"/><text class="label" x="562" y="458">Valid</text><path class="edge" d="M540 540 V585"/><path class="edge" d="M390 625 H170 V430"/><text class="label" x="349" y="613">No</text><path class="edge" d="M540 665 V705"/><text class="label" x="557" y="692">Yes</text><path class="edge" d="M540 770 V815"/><path class="edge" d="M540 880 V925"/><rect class="node " x="390" y="25" width="300" height="65" rx="8"/><text class="" x="540.0" y="62.5">Submit either short form</text><polygon class="decision" points="540.0,125 690,165.0 540.0,205 390,165.0"/><text class="" x="540.0" y="170.0">Valid name and email?</text><rect class="node offer" x="35" y="135" width="270" height="60" rx="8"/><text class="" x="170.0" y="160.0">Show field errors</text><text class="sub" x="170.0" y="180.0">Correct and resubmit</text><polygon class="decision" points="540.0,245 690,285.0 540.0,325 390,285.0"/><text class="" x="540.0" y="290.0">Honeypot filled?</text><rect class="node end" x="775" y="255" width="270" height="60" rx="8"/><text class="" x="910.0" y="280.0">Show success; no lead</text><text class="sub" x="910.0" y="300.0">No API request from browser</text><rect class="node system" x="390" y="365" width="300" height="65" rx="8"/><text class="" x="540.0" y="392.5">POST /api/free-valuation</text><text class="sub" x="540.0" y="412.5">Server checks body and fields</text><rect class="node offer" x="35" y="365" width="270" height="65" rx="8"/><text class="" x="170.0" y="392.5">Show error; allow retry</text><text class="sub" x="170.0" y="412.5">Network / validation / send error</text><rect class="node system" x="390" y="475" width="300" height="65" rx="8"/><text class="" x="540.0" y="502.5">Send internal email</text><text class="sub" x="540.0" y="522.5">info@watchreserve.co.uk</text><polygon class="decision" points="540.0,585 690,625.0 540.0,665 390,625.0"/><text class="" x="540.0" y="630.0">Internal send succeeds?</text><rect class="node system" x="390" y="705" width="300" height="65" rx="8"/><text class="" x="540.0" y="732.5">Attempt customer confirmation</text><text class="sub" x="540.0" y="752.5">Promises a later link from the team</text><rect class="node system" x="390" y="815" width="300" height="65" rx="8"/><text class="" x="540.0" y="842.5">Attempt Klaviyo profile sync</text><text class="sub" x="540.0" y="862.5">Marketing subscription only if opted in</text><rect class="node offer" x="390" y="925" width="300" height="70" rx="8"/><text class="" x="540.0" y="955.0">Return success; show confirmation</text><text class="sub" x="540.0" y="975.0">Track form_submit; dismiss after 3.2s</text></svg>